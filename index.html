  if(IMP.mode==='import') h+='<label class="imdrop" id="imDrop"><input type="file" id="imFile" accept=".json,application/json" multiple hidden><b>Drop .json files here</b><span>or click to choose. You can pick many at once, or one master file.</span></label>';
  else h+='<div class="imdrop static"><b>Recheck every deal on the site</b><span>Finds broken links, sold out items and links that open the wrong product, so you can hide them in one click.</span><button class="btn pri" data-imrecheck="1">Start recheck</button></div>';
  h+='<div id="imOut"></div>';
  return h;
}
function impRender(){
  var el=document.getElementById('imOut'); if(!el) return;
  var rows=IMP.rows; if(!rows.length&&!IMP.stats){ el.innerHTML=''; return; }
  var c={}; rows.forEach(function(r){ var s=r.dup?'dup':impRowState(r); c[s]=(c[s]||0)+1; });
  var total=rows.filter(function(r){return !r.dup;}).length, checked=rows.filter(function(r){return r.r&&!r.dup;}).length;
  var h='<div class="imsum">'+(IMP.stats?'<span><b>'+IMP.stats.files+'</b> files</span><span><b>'+IMP.stats.picks+'</b> picks</span><span><b>'+IMP.stats.repeats+'</b> repeats removed</span><span><b>'+IMP.stats.onsite+'</b> already on the site</span>':'')+
    Object.keys(IMP_STATE).filter(function(k){return c[k]&&k!=='dup';}).map(function(k){ return '<span class="st '+IMP_STATE[k][1]+'"><b>'+c[k]+'</b> '+IMP_STATE[k][0]+'</span>'; }).join('')+'</div>';
  h+='<div class="improg"><i style="width:'+(total?Math.round(100*checked/total):0)+'%"></i></div>';
  if(IMP.mode==='import'){
    var add=rows.filter(function(r){ return !r.dup&&r.r&&r.inc; }).length;
    h+='<div class="imact">'+(IMP.busy?'<span class="whint">Checking '+checked+' of '+total+'… keep this tab open.</span>':'<button class="btn pri" data-imsave="1"'+(add?'':' disabled')+'>Add '+add+' deal'+(add===1?'':'s')+' to the site</button><span class="whint">Checked items are ticked. Untick anything you don’t want.</span>')+'</div>';
  } else {
    var bad=rows.filter(function(r){ return r.r&&r.inc&&['dead','sold_out','mismatch','bad_link'].indexOf(impRowState(r))>=0; }).length;
    var upd=rows.filter(function(r){ return r.r&&r.r.state==='ok'&&impRowState(r)==='ok'&&((r.r.price>0&&r.d.price&&Math.abs(r.r.price-r.d.price)/r.d.price>0.03)||(!r.d.img&&r.r.img)); }).length;
    h+='<div class="imact">'+(IMP.busy?'<span class="whint">Checking '+checked+' of '+total+'… keep this tab open.</span>':'<button class="btn pri" data-imretire="1"'+(bad?'':' disabled')+'>Hide '+bad+' problem deal'+(bad===1?'':'s')+'</button><button class="btn sec" data-imupdate="1"'+(upd?'':' disabled')+'>Update '+upd+' price'+(upd===1?'':'s')+' and photos</button>')+'</div>';
  }
  var order={mismatch:0,dead:1,sold_out:2,bad_link:3,error:4,blocked:5,ok:6,wait:7,dup:8};
  var show=rows.filter(function(r){ return !r.dup; }).slice().sort(function(a,b){ return order[impRowState(a)]-order[impRowState(b)]; });
  h+='<div class="imtable">'+show.slice(0,400).map(function(r){
    var s=impRowState(r), st=IMP_STATE[s]||IMP_STATE.error, p=r.p, img=(r.r&&r.r.img)||p.img;
    var why=r.skip?' · '+esc(r.skip)+(/bar/.test(r.skip)?(r.inc?' · adding anyway':' · tick to add anyway'):''):(s==='mismatch'&&r.r?' · page says “'+esc((r.r.title||'').slice(0,60))+'”':'');
    var price=(r.r&&r.r.price>0&&p.price&&Math.abs(r.r.price-p.price)/p.price>0.03)?'$'+p.price+' → <b>$'+r.r.price+'</b>':'$'+(p.price||'?');
    return '<div class="imrow"><input type="checkbox" data-iminc="'+r.k+'"'+(r.inc?' checked':'')+(r.r&&(!r.skip||/bar/.test(r.skip))?'':' disabled')+'>'+(img?'<img src="'+esc(img)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="imph"></span>')+
      '<div class="imn"><b>'+esc(p.name)+'</b><span>'+esc(FAMN[p._who]||NAMES[p._who]||p._who||'')+' · '+esc(p.store||'')+' · '+price+why+'</span></div><span class="st '+st[1]+'">'+st[0]+'</span><a class="lnk" href="'+esc(p.url)+'" target="_blank" rel="noopener">Open</a></div>';
  }).join('')+(show.length>400?'<p class="whint">Showing the first 400.</p>':'')+'</div>';
  el.innerHTML=h;
}
function impDefaultInc(r){
  var s=impRowState(r);
  if(IMP.mode==='recheck') return ['dead','sold_out','mismatch','bad_link'].indexOf(s)>=0;
  if(s!=='ok'&&s!=='blocked') return false;
  var b=impBuild(r); r.skip=b.skip||null; r.deal=b.deal||null; return !!b.deal;
}
function impRun(){
  var todo=IMP.rows.filter(function(r){ return !r.dup&&!r.r; }); if(!todo.length){ IMP.busy=false; impRender(); return; }
  IMP.busy=true; impRender();
  var size=IMP.retrying?1:3, i=0, lanes=4, lastDraw=0;
  function finish(){
    var again=IMP.rows.filter(function(r){ return !r.dup&&r.r&&r.r.state==='error'&&!r.retried; });
    if(again.length&&!IMP.retrying){ again.forEach(function(r){ r.retried=1; r.r=null; }); IMP.retrying=true; impRun(); return; }
    IMP.retrying=false; IMP.busy=false; impRender(); toast('Check finished');
  }
  function next(){
    if(i>=todo.length){ lanes--; if(!lanes) finish(); return; }
    var batch=todo.slice(i,i+size); i+=size;
    api('check',{method:'POST',body:JSON.stringify({items:batch.map(function(r){ return {key:r.k,url:r.p.url,store:r.p.store,name:r.p.name}; })})})
      .then(function(res){ (res.results||[]).forEach(function(x){ var r=IMP.rows[x.key]; if(!r) return; r.r=x; r.id=x.id||r.id; r.inc=impDefaultInc(r); }); })
      .catch(function(){ batch.forEach(function(r){ r.r={state:'error'}; r.inc=false; }); })
      .then(function(){ if(Date.now()-lastDraw>700){ lastDraw=Date.now(); impRender(); } next(); });
  }
  var start=lanes; for(var l=0;l<start;l++) next();
}
function impLoadFiles(files){
  var list=[].slice.call(files||[]); if(!list.length) return;
  Promise.all(list.map(function(f){ return f.text().then(function(t){ try{ return impParse(JSON.parse(t),f.name); }catch(e){ toast(f.name+' is not valid JSON'); return []; } }); })).then(function(all){
    var picks=[].concat.apply([],all), site=impSiteKeys(), seen={}, rows=[], rep=0, onsite=0;
    picks.sort(function(a,b){ return impFill(b)-impFill(a); });
    picks.forEach(function(p){
      var ks=impKeys(p);
      if(ks.some(function(k){ return site[k]; })){ onsite++; return; }
      if(ks.some(function(k){ return seen[k]; })){ rep++; return; }
      ks.forEach(function(k){ seen[k]=1; });
      rows.push({k:rows.length,p:p,r:null,inc:false});
    });
    IMP.rows=rows; IMP.stats={files:list.length,picks:picks.length,repeats:rep,onsite:onsite};
    impRender(); impRun();
  });
}
function impRecheck(){
  var rows=[]; DEALS.forEach(function(d){ if(!d.url||!live(d)) return; rows.push({k:rows.length,p:{name:d.name,store:d.store,url:d.url,price:d.price,img:d.img,_who:d.who},d:d,id:d.id,r:null,inc:false}); });
  IMP.rows=rows; IMP.stats=null; impRender(); impRun();
}
function impMerge(list,retired,info){
  (retired||[]).forEach(function(id){ RETIRED[id]=1; var x=(info&&info[id])||{}; HIDDEN[id]={reason:x.reason||(HIDDEN[id]&&HIDDEN[id].reason)||'',at:x.at||Date.now(),deal:x.deal||BY[id]||(HIDDEN[id]&&HIDDEN[id].deal)||null}; });
  if(retired&&retired.length){ DEALS=DEALS.filter(function(d){ return !RETIRED[d.id]; }); retired.forEach(function(id){ delete BY[id]; }); }
  (list||[]).forEach(function(d){ if(!d||!d.id) return; if(RETIRED[d.id]){ delete RETIRED[d.id]; delete HIDDEN[d.id]; } d.saved$=(d.was&&d.price!=null)?Math.round((d.was-d.price)*100)/100:0; if(BY[d.id]){ Object.assign(BY[d.id],d); } else { DEALS.push(d); BY[d.id]=d; } });
}
function impLoadSite(){ if(!SYNC.on) return; api('deals').then(function(r){ var info={}; (r.hidden||[]).forEach(function(x){ info[x.id]=x; }); impMerge([],r.retired,info); impMerge(r.deals,[]); render(); }).catch(function(){}); }
function impSave(list,label){
  var chunks=[]; for(var i=0;i<list.length;i+=50) chunks.push(list.slice(i,i+50));
  var n=0;
  return chunks.reduce(function(pr,ch){ return pr.then(function(){ return api('deals',{method:'POST',body:JSON.stringify({deals:ch})}).then(function(r){ n+=r.saved||0; }); }); },Promise.resolve())
    .then(function(){ impMerge(list,[]); toast(label.replace('#',n)); return n; });
}
document.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-imode]'))){ IMP.mode=t.getAttribute('data-imode'); IMP.rows=[]; IMP.stats=null; render(); return; }
  if((t=e.target.closest('[data-imrecheck]'))){ if(!IMP.busy) impRecheck(); return; }
  if((t=e.target.closest('[data-iminc]'))){ var r=IMP.rows[+t.getAttribute('data-iminc')]; if(r){ r.inc=t.checked; if(t.checked&&r.skip&&!r.deal){ var fb=impBuild(r,true); r.deal=fb.deal||null; if(!r.deal) r.inc=false; } } var keep=window.scrollY; impRender(); window.scrollTo(0,keep); return; }
  if((t=e.target.closest('[data-imsave]'))){
    var list=IMP.rows.filter(function(r){ return !r.dup&&r.inc&&r.deal; }).map(function(r){ return r.deal; });
    if(!list.length) return; t.disabled=true;
    impSave(list,'Added # deals to the site').then(function(){ IMP.rows=[]; IMP.stats=null; impRender(); }).catch(function(){ t.disabled=false; toast('Could not save. Try again'); });
    return;
  }
  if((t=e.target.closest('[data-imretire]'))){
    var items=IMP.rows.filter(function(r){ return r.inc&&r.r&&['dead','sold_out','mismatch','bad_link'].indexOf(impRowState(r))>=0; }).map(function(r){ return {id:r.id,reason:IMP_STATE[impRowState(r)][0]}; });
    if(!items.length) return; t.disabled=true;
    api('retire',{method:'POST',body:JSON.stringify({items:items})}).then(function(){ var info={}; items.forEach(function(x){ info[x.id]={reason:x.reason,at:Date.now()}; }); impMerge([],items.map(function(x){return x.id;}),info); IMP.rows=IMP.rows.filter(function(r){ return !(r.inc&&items.some(function(x){return x.id===r.id;})); }); toast('Hid '+items.length+' deals'); impRender(); }).catch(function(){ t.disabled=false; toast('Could not save. Try again'); });
    return;
  }
  if((t=e.target.closest('[data-imrestore]'))){
    var rid=t.getAttribute('data-imrestore'), hd=HIDDEN[rid]; t.disabled=true;
    api('retire',{method:'POST',body:JSON.stringify({items:[],restore:[rid]})}).then(function(){ delete RETIRED[rid]; delete HIDDEN[rid]; if(hd&&hd.deal&&!BY[hd.deal.id]){ DEALS.push(hd.deal); BY[hd.deal.id]=hd.deal; } toast('Restored'); render(); }).catch(function(){ t.disabled=false; toast('Could not restore. Try again'); });
    return;
  }
  if((t=e.target.closest('[data-imupdate]'))){
    var ups=IMP.rows.filter(function(r){ return r.r&&r.r.state==='ok'&&impRowState(r)==='ok'; }).map(function(r){ var d=Object.assign({},r.d), ch=false;
      if(r.r.price>0&&d.price&&Math.abs(r.r.price-d.price)/d.price>0.03&&!(d.was&&Math.abs(r.r.price-d.was)/d.was<0.02)){ d.price=r.r.price; d.pct=d.was&&d.was>d.price?Math.round((1-d.price/d.was)*100):0; if(!d.pct) d.was=null; ch=true; }
      if(!d.img&&r.r.img){ d.img=r.r.img; ch=true; }
      return ch?d:null; }).filter(Boolean);
    if(!ups.length) return; t.disabled=true;
    impSave(ups,'Updated # deals').then(function(){ impRender(); }).catch(function(){ t.disabled=false; toast('Could not save. Try again'); });
    return;
  }
});
document.addEventListener('change',function(e){ if(e.target&&e.target.id==='imFile') impLoadFiles(e.target.files); });
document.addEventListener('dragover',function(e){ if(route==='import'&&e.target.closest&&e.target.closest('#imDrop')){ e.preventDefault(); e.target.closest('#imDrop').classList.add('over'); } });
document.addEventListener('dragleave',function(e){ var z=e.target.closest&&e.target.closest('#imDrop'); if(z) z.classList.remove('over'); });
document.addEventListener('drop',function(e){ var z=route==='import'&&e.target.closest&&e.target.closest('#imDrop'); if(!z) return; e.preventDefault(); z.classList.remove('over'); impLoadFiles(e.dataTransfer.files); });

/* ---------- boot ---------- */
renderEventBar(); renderFoot(); syncSaved(); buildFlora(); wishCount(); syncBoot();
go((location.hash||'#today').replace('#','')||'today'); window._navPush=true;
setInterval(function(){ tick(); if(Math.floor(Date.now()/1000)%30===0) renderEventBar(); },1000);
</script>
