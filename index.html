<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deal Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Serif+KR:wght@500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080B11;--bg2:#0D1119;--card:#121722;--card2:#171D2A;--line:#212938;--line2:#2E384B;
  --ink:#F1F4F9;--ink2:#A2ADC1;--ink3:#69758B;
  --plate:#EEF1F6;--accent:#3D8BFF;--accent2:#86B6FF;--onaccent:#fff;
  --tag:#FFE14D;--tagInk:#1E1800;--good:#3DDC97;--hot:#FF5C6C;
  --disp:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --shadow:0 22px 50px -24px rgba(0,0,0,.75);
  --glow:radial-gradient(1100px 620px at 82% -12%,rgba(61,139,255,.17),transparent 62%),radial-gradient(800px 520px at -8% 6%,rgba(255,225,77,.05),transparent 60%);
  color-scheme:dark;
}
body[data-world="rachel"],.world-rachel{
  --bg:#FFF6F3;--bg2:#FFFBFA;--card:#FFFFFF;--card2:#FFF0F2;--line:#F1DADF;--line2:#E6C2CC;
  --ink:#3A2130;--ink2:#80606E;--ink3:#B0909C;
  --plate:#FFFFFF;--accent:#DD527C;--accent2:#F08AAA;--onaccent:#fff;
  --tag:#FFD2DF;--tagInk:#7C1D41;--good:#2FA36F;--hot:#DD527C;
  --disp:'Fraunces',Georgia,serif;
  --shadow:0 22px 50px -26px rgba(150,60,90,.35);
  --glow:radial-gradient(1000px 620px at 86% -12%,rgba(240,110,150,.16),transparent 62%),radial-gradient(760px 520px at -6% 0%,rgba(255,196,170,.22),transparent 60%);
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .55s ease,color .55s ease}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--glow)}
img{display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.mono,.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:20px;padding:12px clamp(16px,3vw,40px);background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transition:background-color .55s}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:9px;background:var(--tag);color:var(--tagInk);display:grid;place-items:center;transform:rotate(-9deg);transition:background .55s}
.tabs{display:flex;gap:3px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;margin:0 auto;overflow-x:auto;scrollbar-width:none;transition:background .55s}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 16px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--ink2);white-space:nowrap;transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.tab.on[data-go="rachel"]{background:#DD527C;color:#fff}
.hdr-r{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;width:240px;color:var(--ink3);transition:border-color .2s,background .55s}
.search:focus-within{border-color:var(--accent)}
.search input{background:none;border:none;outline:none;color:var(--ink);width:100%}
.search input::placeholder{color:var(--ink3)}
.search kbd{font:600 11px var(--body);color:var(--ink3);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.savedbtn{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px;transition:background .55s}
.savedbtn svg{color:var(--hot)}

/* event bar */
.eventbar{position:relative;z-index:1;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 26px;padding:9px 16px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line);background:var(--bg2);transition:background .55s}
.eventbar:empty{display:none}
.ev{display:inline-flex;align-items:center;gap:8px}
.ev b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--hot);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hot) 70%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

main{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:26px clamp(16px,3vw,40px) 70px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .15s,background .2s,border-color .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:var(--onaccent)}
.btn.sec{background:var(--card);border:1px solid var(--line2);color:var(--ink)}
.btn.sec.on svg{fill:currentColor;color:var(--hot)}
.lnk{color:var(--accent);font-weight:600;font-size:13.5px}
.lnk:hover{text-decoration:underline}
.ib{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);color:var(--ink2);transition:transform .15s,color .15s,background .15s;backdrop-filter:blur(6px)}
.ib:hover{transform:scale(1.08);color:var(--ink)}
.ib.on{color:var(--hot)}
.ib.on svg{fill:currentColor}
.ib svg{width:16px;height:16px}

/* cards */
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s,background .55s}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:var(--shadow)}
.plate{position:relative;aspect-ratio:1/1;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 42%,#fff 0%,var(--plate) 72%);overflow:hidden}
.plate img{position:absolute;left:18px;top:18px;width:calc(100% - 36px);height:calc(100% - 36px);object-fit:contain;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.plate.cover{padding:0}
.plate.cover img{left:0;top:0;width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.card:hover .plate img{transform:scale(1.06)}
.ph{font-size:40px;opacity:.55}
.tag{position:absolute;left:12px;top:12px;z-index:2;display:inline-flex;align-items:center;background:var(--tag);color:var(--tagInk);font:700 13px/1 'Space Grotesk',system-ui,sans-serif;padding:6px 10px 6px 15px;border-radius:5px;clip-path:polygon(8px 0,100% 0,100% 100%,8px 100%,0 50%);letter-spacing:-.01em}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;background:color-mix(in srgb,var(--tagInk) 35%,transparent)}
.acts{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
.fave{position:absolute;left:12px;bottom:12px;z-index:2;font:600 11.5px var(--body);color:#fff;background:#DD527C;border-radius:999px;padding:4px 9px}
.cb{display:flex;flex-direction:column;gap:5px;padding:13px 15px 15px;flex:1}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink3);font-weight:500}
.bl span:first-child{color:var(--ink2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm{font:600 14.5px/1.3 var(--body);color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.now{font:700 21px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.was{color:var(--ink3);text-decoration:line-through;font-size:13px;font-variant-numeric:tabular-nums}
.mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:7px}
.sp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2);padding:3px 9px 3px 7px;border-radius:999px;background:var(--card2);border:1px solid var(--line)}
.sp i{width:22px;height:5px;border-radius:5px;background:var(--line2);position:relative;overflow:hidden}
.sp i::after{content:"";position:absolute;inset:0;width:calc((var(--v) - 50) * 2%);background:var(--sc,var(--ink2));border-radius:5px}
.sp b{color:var(--ink);font-variant-numeric:tabular-nums}
.sp.steal{--sc:var(--tag);color:var(--ink)}
.sp.great{--sc:var(--accent)}
.sp.budget{--sc:var(--good)}
.cd{font-size:11.5px;font-weight:600;color:var(--hot);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.ended{color:var(--ink3)}
.who{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink3)}
.who.rachel{color:#DD527C;border-color:color-mix(in srgb,#DD527C 35%,transparent)}
.who.both{color:var(--accent2)}
.codechip{position:relative;z-index:3;font:600 11px 'Space Grotesk',sans-serif;color:var(--tagInk);background:var(--tag);border-radius:6px;padding:3px 7px}
.stretch{position:absolute;inset:0;z-index:1;border-radius:18px}
.card.is-ended{opacity:.5}
.card.is-ended:hover{opacity:.8}

/* grids & rails */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(200px,calc((100% - 64px)/5),290px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>.card{scroll-snap-align:start}
.sec:not(.btn){margin:38px 0 0}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.sech h2{font:600 23px/1.15 var(--disp);letter-spacing:-.02em}
.sech p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.rnav{display:flex;gap:6px}
.rb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--ink2);background:var(--card);transition:color .15s,border-color .15s}
.rb:hover{color:var(--ink);border-color:var(--ink3)}

/* hero */
.hero{position:relative;height:clamp(440px,52vw,520px);border-radius:30px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.hs{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(135deg,var(--card2) 0%,var(--card) 60%);color:var(--ink);opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.hs.on{opacity:1;visibility:visible;z-index:1}
.hs::after{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none;opacity:.9}
.ht{position:relative;z-index:2;padding:clamp(26px,4vw,60px);display:flex;flex-direction:column;justify-content:center;gap:15px;min-width:0}
.hey{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--ink2)}
.hbrand{font:600 15px var(--body);color:var(--accent)}
.hname{font:600 clamp(30px,3.6vw,50px)/1.03 var(--disp);letter-spacing:-.03em;max-width:15ch}
.world-rachel .hname,body[data-world="rachel"] .hname{font-style:italic}
.hwhy{color:var(--ink2);font-size:15.5px;max-width:44ch;line-height:1.55}
.hprice{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hprice .now{font-size:clamp(38px,4.2vw,58px)}
.hprice .was{font-size:17px}
.sv{font:700 13px 'Space Grotesk',sans-serif;color:var(--tagInk);background:var(--tag);padding:6px 11px;border-radius:999px}
.hcta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.hcta .cd{font-size:13.5px;margin-left:6px}
.hi{position:relative;z-index:2;display:grid;place-items:center;padding:32px}
.hi::before{content:"";position:absolute;width:min(82%,440px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff 0%,var(--plate) 68%);box-shadow:0 50px 90px -40px rgba(0,0,0,.65),inset 0 -20px 50px -30px rgba(0,0,0,.12)}
.hi img{position:relative;max-width:min(60%,330px);max-height:62%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.hi.cover img{max-width:min(78%,420px);border-radius:14px;max-height:none}
.hs.on .hi img{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hs.on .ht>*{animation:fadeup .7s cubic-bezier(.2,.7,.2,1) both}
.hs.on .ht>*:nth-child(2){animation-delay:.05s}.hs.on .ht>*:nth-child(3){animation-delay:.1s}.hs.on .ht>*:nth-child(4){animation-delay:.15s}.hs.on .ht>*:nth-child(5){animation-delay:.2s}.hs.on .ht>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hdots{position:absolute;left:clamp(26px,4vw,60px);bottom:22px;z-index:3;display:flex;gap:8px}
.hdot{width:34px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink3) 45%,transparent);overflow:hidden;position:relative}
.hdot i{position:absolute;inset:0;width:0;background:var(--ink)}
.hdot.on i{animation:prog 7s linear forwards}
.hero.paused .hdot.on i{animation-play-state:paused}
@keyframes prog{to{width:100%}}

.barline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 4px 0;color:var(--ink2);font-size:14px}
.barline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* two worlds preview */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:40px}
.world{border-radius:26px;padding:22px;border:1px solid var(--line);background:linear-gradient(160deg,var(--card2),var(--bg2));color:var(--ink);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.world::after{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none;opacity:.7}
.world>*{position:relative;z-index:1}
.world .wh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.world h2{font:600 26px/1.1 var(--disp);letter-spacing:-.02em}
.world-rachel h2{font-style:italic}
.world p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.world .grid{grid-template-columns:repeat(4,1fr);gap:12px}
.world .card .cb{padding:10px 11px 12px}
.world .card .nm{font-size:13px}
.world .card .now{font-size:17px}

/* person pages */
.phead{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:stretch}
.ptitle{display:flex;flex-direction:column;justify-content:flex-start;padding-top:18px!important;gap:10px;padding:8px 0}
.ptitle h1{font:600 clamp(40px,5.4vw,72px)/.98 var(--disp);letter-spacing:-.035em}
body[data-world="rachel"] .ptitle h1{font-style:italic;font-weight:500}
.kr{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--accent);letter-spacing:.04em}
.pblurb{color:var(--ink2);font-size:16px;max-width:52ch}
.pstat{color:var(--ink3);font-size:13.5px}
.fcard{position:relative;display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:center;margin-top:14px;padding:14px 16px 14px 14px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.fcard:hover{transform:translateY(-3px)}
.fimg{position:relative;aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 50% 42%,#fff,var(--plate) 72%);display:grid;place-items:center;padding:16px;overflow:hidden}
.fimg img{position:absolute;left:16px;top:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.finfo{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:44px}
.finfo .flab{font-size:12.5px;font-weight:600;color:var(--ink3)}
.finfo h3{font:500 italic 26px/1.1 var(--disp);letter-spacing:-.02em}
.finfo p{color:var(--ink2);font-size:13.5px}
.finfo .pr .now{font-size:24px}
.fcard .acts{top:14px;right:14px}
@media (max-width:540px){.fcard{grid-template-columns:112px minmax(0,1fr);gap:12px}.finfo h3{font-size:20px}.finfo p{display:none}}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.pcard h3{font:600 18px var(--disp)}
.pf{display:flex;flex-direction:column;gap:8px}
.pf>span{font-size:12.5px;font-weight:600;color:var(--ink3)}
.pf textarea{width:100%;min-height:62px;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;font-size:13.5px}
.pf textarea:focus{border-color:var(--accent)}
.budget{display:flex;align-items:center;gap:12px}
.budget b{font:600 14px var(--disp);white-space:nowrap;min-width:92px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font:600 26px/1.1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--ink3)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:13px;transition:background .15s,color .15s,border-color .15s}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body[data-world="rachel"] .chip.on,.world-rachel .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-weight:500;opacity:.6;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chiprow{display:flex;align-items:center;gap:12px;margin:30px 0 4px;flex-wrap:wrap}
.chiprow .hint{color:var(--ink3);font-size:12.5px}
.bchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--bg2)}
.bchip svg{width:12px;height:12px}
.bchip.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.bchip.on svg{fill:currentColor}

/* all deals */
.allwrap{display:grid;grid-template-columns:282px minmax(0,1fr);gap:24px;align-items:start;margin-top:6px}
.fpanel{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 104px);overflow:auto;scrollbar-width:thin}
.fg h4{font:600 12.5px/1 var(--body);color:var(--ink3);margin-bottom:10px;display:flex;justify-content:space-between}
.fg h4 button{color:var(--accent);font-weight:600;font-size:12px}
.fg .chips{gap:6px}
.fg .chip{padding:6px 11px;font-size:12.5px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s}
.seg button.on{background:var(--card2);color:var(--ink);box-shadow:0 1px 0 var(--line2) inset,0 4px 12px -6px rgba(0,0,0,.4)}
.dual{position:relative;height:30px}
.dual .track,.dual .fill{position:absolute;top:13px;height:4px;border-radius:4px}
.dual .track{left:0;right:0;background:var(--line2)}
.dual .fill{background:var(--accent)}
.dual input{position:absolute;inset:0;width:100%;-webkit-appearance:none;appearance:none;background:none;pointer-events:none;margin:0}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--accent);cursor:pointer}
.rv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:2px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.tgl input{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl input::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl input:checked{background:var(--accent)}
.tgl input:checked::after{transform:translateX(15px)}
.rbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rbar h1{font:600 34px/1 var(--disp);letter-spacing:-.03em}
.rbar p{color:var(--ink2);font-size:13.5px;margin-top:6px}
.rctl{display:flex;gap:10px;align-items:center}
.sel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600;font-size:13px;color:var(--ink);outline:none;cursor:pointer}
.sel:focus{border-color:var(--accent)}
.grid.list{grid-template-columns:1fr;gap:10px}
.grid.list .card{flex-direction:row;align-items:stretch}
.grid.list .plate{width:128px;flex-shrink:0;aspect-ratio:auto;padding:12px}
.grid.list .tag{font-size:11.5px;left:8px;top:8px}
.grid.list .acts{flex-direction:row;top:auto;bottom:10px;right:12px}
.grid.list .nm{min-height:0;-webkit-line-clamp:1}
.grid.list .cb{padding-right:100px}
.filtbtn{display:none}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:48px 20px;color:var(--ink2);border:1px dashed var(--line2);border-radius:22px}
.empty strong{font:600 18px var(--disp);color:var(--ink)}

/* moods */
.mhead h1{font:600 clamp(36px,4.8vw,62px)/1 var(--disp);letter-spacing:-.035em}
.mhead p{color:var(--ink2);font-size:16px;margin-top:10px;max-width:56ch}
.mtools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 18px}
.mtools .seg{width:auto}
.mwrap{display:grid;grid-template-columns:minmax(320px,620px) minmax(0,1fr);gap:26px;align-items:start}
.mmap{position:relative;aspect-ratio:1/1;border-radius:30px;background:var(--card);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mmap.dragging{cursor:grabbing}
.mmap .tint{position:absolute;inset:0;background:radial-gradient(60% 60% at 100% 0%,rgba(255,176,32,.13),transparent 70%),radial-gradient(60% 60% at 0% 0%,rgba(255,125,176,.14),transparent 70%),radial-gradient(60% 60% at 0% 100%,rgba(79,195,138,.12),transparent 70%),radial-gradient(60% 60% at 100% 100%,rgba(38,195,240,.12),transparent 70%)}
.mmap .ax{position:absolute;background:var(--line)}
.mmap .ax.x{left:6%;right:6%;top:50%;height:1px}
.mmap .ax.y{top:6%;bottom:6%;left:50%;width:1px}
.alab{position:absolute;font:600 12px var(--body);color:var(--ink3);z-index:3;pointer-events:none}
.alab.l{left:14px;top:50%;transform:translateY(6px)}.alab.r{right:14px;top:50%;transform:translateY(6px)}
.alab.t{top:12px;left:50%;transform:translateX(10px)}.alab.b{bottom:12px;left:50%;transform:translateX(10px)}
.mblob{position:absolute;width:36%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--c) 0%,transparent 66%);opacity:.14;pointer-events:none}
.mzone{position:absolute;transform:translate(-50%,-50%);z-index:5;display:inline-flex;align-items:center;gap:6px;font:600 12px var(--body);color:var(--ink);background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(4px);transition:transform .2s,border-color .2s}
.mzone i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mzone:hover{transform:translate(-50%,-50%) scale(1.06);border-color:var(--c)}
.mzone.near{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.bub{position:absolute;width:36px;height:36px;border-radius:50%;transform:translate(-50%,-50%) scale(var(--s,1));background:#fff;border:2px solid var(--line2);overflow:hidden;z-index:2;opacity:var(--o,.5);transition:transform .25s ease,opacity .25s ease,border-color .25s;cursor:pointer}
.bub img{width:100%;height:100%;object-fit:contain;padding:3px}
.bub.near{border-color:var(--accent);z-index:3}
.bub .ph{font-size:16px;display:grid;place-items:center;height:100%}
.orb{position:absolute;width:76px;height:76px;border-radius:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,var(--oc,#3D8BFF) 34%,transparent 70%);box-shadow:0 0 50px 12px color-mix(in srgb,var(--oc,#3D8BFF) 45%,transparent);transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),background .4s}
.mmap.dragging .orb{transition:background .4s}
.mtip{position:absolute;z-index:8;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .15s}
.mtip.on{opacity:1}
.mside h2{font:600 30px/1.05 var(--disp);letter-spacing:-.025em;display:flex;align-items:center;gap:12px}
.mside h2 i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c)}
.mside>p{color:var(--ink2);margin:8px 0 18px;font-size:14.5px}
.mside .grid{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.mside .card .cb{padding:10px 12px 12px}
.mside .card .nm{font-size:13px}
.mside .card .now{font-size:17px}

/* saved */
.svwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.svcol{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;color:var(--ink);display:flex;flex-direction:column}
.svh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.svh h2{font:600 24px var(--disp);letter-spacing:-.02em}
.world-rachel .svh h2{font-style:italic}
.svh span{color:var(--ink3);font-size:13px}
.svrow{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.svrow .th{width:68px;height:68px;border-radius:14px;background:radial-gradient(circle,#fff,var(--plate));display:grid;place-items:center;overflow:hidden;padding:6px}
.svrow .th img{max-width:100%;max-height:100%;object-fit:contain}
.svi{display:flex;flex-direction:column;gap:4px;min-width:0}
.svi .nm{min-height:0;-webkit-line-clamp:1}
.svctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
.svctl input{width:74px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;outline:none;font-size:12.5px;font-variant-numeric:tabular-nums}
.hit{color:var(--good);font-weight:600}
.sva{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sva button{font-size:12px;font-weight:600;color:var(--ink3)}
.sva button:hover{color:var(--ink)}
.svtot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:16px;gap:10px;flex-wrap:wrap}
.svtot b{font:600 22px var(--disp);font-variant-numeric:tabular-nums}
.svtot span{color:var(--good);font-weight:600;font-size:13.5px}

/* sheet & modal */
.sheet{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,8,14,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sheet.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sbox{position:relative;width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:28px;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 40px 100px -30px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.simg{background:radial-gradient(circle at 50% 44%,#fff 0%,var(--plate) 72%);display:grid;place-items:center;padding:36px;min-height:380px}
.simg img{max-width:100%;max-height:420px;object-fit:contain}
.simg.cover{padding:0}.simg.cover img{width:100%;height:100%;object-fit:cover;max-height:none}
.sinfo{padding:30px;display:flex;flex-direction:column;gap:14px}
.sinfo h2{font:600 30px/1.08 var(--disp);letter-spacing:-.025em}
.world-rachel .sinfo h2{font-style:italic}
.sinfo .why{color:var(--ink2);font-size:15px;line-height:1.55}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--ink2)}
.facts dt{color:var(--ink3)}
.facts dd{color:var(--ink);font-weight:500}
.x{position:absolute;right:14px;top:14px;z-index:5;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.x:hover{color:var(--ink)}
.mbox{position:relative;width:min(640px,100%);max-height:86vh;overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:26px;padding:30px;box-shadow:0 40px 100px -30px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.mbox h2{font:600 28px/1.1 var(--disp);letter-spacing:-.02em;margin-bottom:12px}
.mbox p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin-bottom:12px}
.legend{display:flex;flex-direction:column;gap:8px;margin:14px 0 20px}
.legend div{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.cutlist{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}
.cutlist b{color:var(--ink3);font-variant-numeric:tabular-nums}
.htable{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.htable th{text-align:left;color:var(--ink3);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.htable td{padding:8px 6px;border-bottom:1px solid var(--line);color:var(--ink2)}
.htable td:first-child{color:var(--ink)}
.htable a{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:26px;z-index:200;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 14px 40px -12px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:26px clamp(16px,3vw,40px) 40px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--ink3);font-size:12.5px;border-top:1px solid var(--line)}
.foot button{color:var(--ink2);font-weight:600;font-size:12.5px}
.foot button:hover{color:var(--ink)}


/* rachel v5: profile edit */
.plate.photo{padding:0;background:#F7EFEC}
.plate.photo img{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;max-width:none;max-height:none}
.rgrid .plate{aspect-ratio:4/5}
.tag.soft{background:#fff;color:#C2456C;clip-path:none;border-radius:999px;padding:5px 10px;font:600 11.5px var(--body);box-shadow:0 2px 10px rgba(120,40,70,.12)}
.tag.soft::before{display:none}
.her{font:italic 500 13px/1.45 var(--disp);color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nt{font-size:11.5px;color:var(--ink3);font-weight:500;line-height:1.35}
.bl .pfb{font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.eyebrow{font:700 12px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.pstat b{color:var(--ink)}
.fimg.photo{padding:0}
.fimg.photo img{left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;max-width:none;max-height:none}
.finfo .herl{font:italic 500 15px/1.45 var(--disp);color:var(--ink2)}
.rprof{gap:14px}
.rph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rph span{font-size:11.5px;color:var(--ink3);font-weight:500}
.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sizes div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sizes span{font-size:11px;color:var(--ink3);font-weight:600}
.sizes b{font:600 17px/1.1 var(--disp);white-space:nowrap}
.dna{display:flex;flex-wrap:wrap;gap:6px}
.dna span{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line)}
.dna.no span{background:transparent;text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--ink3)}
.pline{font-size:13.5px;color:var(--ink2)}
.pline::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#F6DE9A,#C99A3E);margin-right:8px;vertical-align:-1px}
.asks{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ask{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:center;padding:12px 48px 12px 12px;background:var(--card);border:1px solid var(--line);border-radius:20px;transition:transform .2s,box-shadow .2s}
.ask:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ask .ai{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff;display:grid;place-items:center;padding:8px}
.ask .ai{position:relative}
.ask .ai img{position:absolute;left:8px;top:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}
.ask .ai.photo{padding:0}.ask .ai.photo img{left:0;top:0;width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
.ab{display:flex;flex-direction:column;gap:3px;min-width:0}
.al{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
.aq{font:500 italic 19px/1.15 var(--disp);color:var(--ink)}
.an{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ap .now{font-size:17px}
.st{font-size:11.5px;font-weight:600;color:var(--good)}
.st.wait{color:var(--ink3)}
.ask .acts{top:10px;right:10px}
.ask .ib{width:30px;height:30px}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.look{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.lcol{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:3px;aspect-ratio:1/1;background:var(--line);overflow:hidden}
.lcol button{position:relative;overflow:hidden;background:#fff;display:block;padding:0;min-height:0}
.lcol button:first-child{grid-row:1/4}
.lcol img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.lcol .ph{position:absolute;inset:0;display:grid;place-items:center}
.gone{font-size:11.5px;font-weight:600;color:var(--ink3)}
.pline.blue::before{background:linear-gradient(135deg,#C9DBF5,#8FB2E0)}
.morefinds .sech h2::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#9DB8E6;margin-left:10px;vertical-align:middle}
.lcol img.ct{object-fit:contain;padding:8px}
.lcol button:hover img{transform:scale(1.06)}
.lb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.lb h3{font:500 italic 23px/1.1 var(--disp);letter-spacing:-.01em}
.lb p{color:var(--ink2);font-size:13.5px}
.lit{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.lit a{display:flex;justify-content:space-between;gap:10px;color:var(--ink2)}
.lit a:hover{color:var(--accent)}
.lit a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lit a b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.lft{display:flex;flex-direction:column;align-items:stretch;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.lft .btn{width:100%}
.tot b{font:600 21px var(--disp);font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--good);font-weight:600;margin-left:6px}
.btn.sm{padding:8px 14px;font-size:13px}
.nearmiss{margin-top:44px;border:1px dashed var(--line2);border-radius:18px;padding:14px 18px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.nearmiss summary{cursor:pointer;font-weight:600;color:var(--ink2);font-size:13.5px}
.nearmiss .cutlist{margin-top:12px}
.herbox{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.herbox span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.herbox p{font:500 italic 16px/1.45 var(--disp);color:var(--ink);margin-top:4px}
.rub{display:flex;flex-direction:column;gap:7px}
.rubh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--ink3)}
.rubh b{color:var(--ink)}
.rr{display:grid;grid-template-columns:124px 1fr 44px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.rr i{height:6px;border-radius:6px;background:var(--line);overflow:hidden;display:block}
.rr em{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.rr b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.simg.photo{padding:0}
.simg.photo img{width:100%;height:100%;max-height:none;object-fit:cover;object-position:50% 15%}
@media (max-width:540px){.ask{grid-template-columns:84px minmax(0,1fr)}.sizes b{font-size:15px}.rr{grid-template-columns:104px 1fr 40px}}

/* flowers in the side gutters (Rachel tab, wide screens only) */
#flora{display:none}
@media (min-width:1640px){body[data-world="rachel"] #flora{display:block;animation:fade 1.2s ease}}
.fl{position:fixed;top:0;height:100vh;width:min(620px,calc((100vw - 1440px)/2 + 56px));z-index:0;pointer-events:none;overflow:hidden}
.fl.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.fl.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 60%,transparent);mask-image:linear-gradient(270deg,#000 60%,transparent)}
.fl svg.art{position:absolute;inset:0;width:100%;height:100%}
.fl .pt{position:absolute;top:-5vh;animation:drift linear infinite;opacity:.7}
@keyframes drift{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(36px,55vh) rotate(170deg)}100%{transform:translate(-12px,112vh) rotate(330deg)}}


/* ===== sub tabs ===== */
.whead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.wtitle h1{font:600 clamp(40px,5.4vw,72px)/.98 var(--disp);letter-spacing:-.035em}
body[data-world="rachel"] .wtitle h1{font-style:italic;font-weight:500}
.ksay{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px;text-align:left;color:var(--ink2)}
.ksay span{font:500 17px/1.3 'Noto Serif KR',serif;color:var(--accent);letter-spacing:.02em}
.ksay em{font:italic 500 14px/1.3 var(--disp);color:var(--ink3)}
.ksay:hover span{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:4px}
.occchip{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line2);font-weight:600;font-size:13px;color:var(--ink2);box-shadow:var(--shadow)}
.occchip b{font:600 18px var(--disp);color:var(--accent)}
.subnav{position:sticky;top:62px;z-index:40;margin:0 -8px 8px;padding:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px}
.subwrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.subwrap::-webkit-scrollbar{display:none}
.subt{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,transform .15s}
.subt i{font-style:normal;font-size:15px}
.subt:hover{color:var(--ink);transform:translateY(-1px)}
.subt.on{background:var(--accent);border-color:var(--accent);color:#fff}
body[data-world="rachel"] .subt{font:500 italic 17px/1.1 var(--disp);letter-spacing:.005em;padding:9px 18px;background:color-mix(in srgb,var(--card) 80%,transparent)}
body[data-world="rachel"] .subt.on{background:var(--accent);color:#fff;box-shadow:0 8px 18px -10px rgba(221,82,124,.8)}
body[data-world="rachel"] .subt:not(.on):hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.muted{color:var(--ink3);font-size:13.5px}
.caphead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:24px 0 18px}
.caphead h2{font:600 30px/1.1 var(--disp);letter-spacing:-.02em;margin-top:4px}
body[data-world="rachel"] .caphead h2{font-style:italic;font-weight:500}
.caphead p{color:var(--ink2);font-size:14.5px;max-width:60ch;margin-top:6px}
.capbtns{display:flex;gap:8px;flex-wrap:wrap}
.capseg{display:flex;flex-wrap:wrap;gap:6px;width:auto;background:none;border:none;padding:0}
.capseg button{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:12.5px;color:var(--ink2)}
.capseg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
body[data-world="rachel"] .capseg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.capseg b{font-weight:700;margin-left:2px}
.th2{display:block;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#fff}
.th2 img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.th2.ct img{object-fit:contain;padding:6px}
.mhead.sub h2{font:600 30px/1.1 var(--disp);letter-spacing:-.02em}
body[data-world="rachel"] .mhead.sub h2{font-style:italic;font-weight:500}
.mhead.sub{margin-top:24px}

/* outfits */
.shuffle{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:22px;align-items:center;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.shl h2{font:500 italic 28px/1.1 var(--disp);margin:4px 0 6px}
.shl p{color:var(--ink2);font-size:13.5px;margin-bottom:14px}
.shbtns{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.shr{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.shi{display:flex;flex-direction:column;gap:6px;text-align:left;animation:shin .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes shin{from{opacity:0;transform:translateY(14px) rotate(-2deg)}to{opacity:1;transform:none}}
.shimg{display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.shimg img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:transform .4s}
.shimg.ct img{object-fit:contain;padding:10px}
.shi:hover .shimg img{transform:scale(1.05)}
.shn{font-size:12.5px;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shn b{display:block;color:var(--ink);font-size:11.5px}
.shp{font:600 15px var(--disp)}
.looks.big{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}

/* capsule */
.capwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.cappick{display:flex;flex-direction:column;gap:14px;position:sticky;top:130px}
.captiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;max-height:62vh;overflow:auto;padding:2px 4px 6px 2px}
.ctile{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;padding:7px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);transition:border-color .15s,transform .15s}
.ctile:hover{transform:translateY(-2px)}
.ctile.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.ctn{font-size:11.5px;line-height:1.25;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctp{font:600 13px var(--disp)}
.ck{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;background:var(--accent);color:#fff;transform:scale(0);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ctile.on .ck{transform:scale(1)}
.capboard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.capstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.capstats div{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column}
.capstats b{font:600 24px/1.1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.capstats span{font-size:12px;color:var(--ink3);font-weight:600}
.closet{margin-top:18px;border-radius:22px;padding:16px 14px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--card2) 90%,#fff),var(--bg2));border:1px solid var(--line)}
.crail{position:relative;display:flex;gap:10px;overflow-x:auto;padding:22px 6px 6px;min-height:200px;align-items:flex-start;scrollbar-width:thin}
.rod{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:5px;background:linear-gradient(90deg,#D9B98A,#F3DFB8,#C9A46B)}
.hang{position:relative;flex:0 0 112px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 4s ease-in-out infinite;animation-delay:calc(var(--i)*-.7s)}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.hanger{width:56px;height:24px;color:#B89466;margin-top:-14px}
.hpic{display:block;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 20px -12px rgba(120,60,80,.45)}
.hpic img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.hpic.ct img{object-fit:contain;padding:6px}
.empty-rail{color:var(--ink3);font-size:13px;padding:40px 10px;margin:auto}
.shelfrow{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:10px}
.shelf,.hooks{display:flex;gap:8px;flex-wrap:wrap;min-height:84px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px dashed var(--line2)}
.shelf{border-bottom:4px solid #E6CFA6}
.fold,.hook{width:72px}
.capsub{font:500 italic 18px var(--disp);margin:18px 0 10px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.combo{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;padding:6px;border-radius:14px;background:var(--bg2);border:1px solid var(--line)}
.cpi{display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#fff}
.cpi img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.cpi.ct img{object-fit:contain;padding:4px}
.capfoot{margin-top:16px;display:flex;justify-content:flex-end}

/* cart */
.cartsec{margin-top:6px}
.carthead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:22px 0 14px}
.carthead h2{font:600 30px/1.1 var(--disp);letter-spacing:-.02em;margin-top:4px}
body[data-world="rachel"] .carthead h2{font-style:italic;font-weight:500}
.carthead p{color:var(--ink2);font-size:14.5px;max-width:58ch;margin-top:6px}
.cbudgetbox{display:flex;flex-direction:column;gap:6px;min-width:260px;padding:12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.cbudgetbox>span{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.cartwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;align-items:start}
.stagebox{position:relative;width:100%;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--card) 0%,var(--bg2) 70%);border:1px solid var(--line);transition:box-shadow .2s,border-color .2s}
.stagebox.hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cart-rachel{--cs:#E8649A;--cs2:#F7A8C6;--liq1:#FFC2D6;--liq2:#F06A9A;--mesh:rgba(232,100,154,.42);--wheel:#5B3A48}
.cart-sam{--cs:#5AA9FF;--cs2:#2B4C7E;--liq1:#8CD0FF;--liq2:#2F6BFF;--mesh:rgba(110,180,255,.38);--wheel:#0F1622}
.cshadow{fill:rgba(0,0,0,.12)}
.cart-sam .cshadow{fill:rgba(0,0,0,.45)}
.cbask{fill:color-mix(in srgb,var(--cs2) 22%,transparent);stroke:none}
.cframe{fill:none;stroke:var(--cs);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.cwheel{fill:var(--wheel);stroke:var(--cs);stroke-width:5}
.chub{fill:var(--cs2)}
.cmesh line{stroke:var(--mesh);stroke-width:2.2}
.crim{fill:none;stroke:var(--cs);stroke-width:7;stroke-linejoin:round}
.crimtop{stroke:var(--cs);stroke-width:11;stroke-linecap:round}
.chandle{stroke:var(--cs);stroke-width:8;stroke-linecap:round}
.cgrip{stroke:var(--cs2);stroke-width:16;stroke-linecap:round}
.cbudget{stroke:#fff;stroke-width:2;stroke-dasharray:6 7;opacity:.9}
.cart-sam .stage svg.cartfront,.cart-sam .stage svg.cartback{filter:drop-shadow(0 0 6px rgba(90,169,255,.55))}
#liquid{transform:translateY(300px);transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.wave{animation:wave 3.2s linear infinite}
@keyframes wave{to{transform:translateX(-120px)}}
.bodies{position:absolute;inset:0}
.body{position:absolute;left:0;top:0;border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 6px 14px -6px rgba(80,30,50,.55);cursor:pointer;z-index:2;will-change:transform}
.body img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;pointer-events:none}
.body.ct img{object-fit:contain;padding:5px}
.body.out{z-index:6}
.cartfront{z-index:4;pointer-events:none}
.cartback{z-index:1}

.drips{position:absolute;left:0;top:124px;width:100%;height:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .3s}
.drips.on{opacity:1}
.drips i{position:absolute;top:0;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--liq2);animation:drip 2.2s ease-in infinite}
@keyframes drip{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(160px) scale(1);opacity:0}}
.cribbon{position:absolute;left:0;right:0;top:20px;display:flex;justify-content:center;z-index:7;pointer-events:none}
.ribbon{position:relative;padding:9px 26px;font:700 15px var(--body);color:#fff;background:var(--cs);border-radius:6px;animation:ribdrop .6s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 10px 20px -10px rgba(0,0,0,.4)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:8px;width:18px;height:100%;background:color-mix(in srgb,var(--cs) 75%,#000);z-index:-1}
.ribbon::before{left:-12px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-12px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.ribbon.left{background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--ink);border:1.5px solid var(--cs)}
.ribbon.left::before,.ribbon.left::after{display:none}
.ribbon.fit{background:linear-gradient(90deg,var(--cs),var(--liq1))}
@keyframes ribdrop{from{transform:translateY(-30px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.stage.shake{animation:cshake .5s ease}
@keyframes cshake{0%,100%{translate:0 0}20%{translate:-5px 0}40%{translate:5px 0}60%{translate:-3px 0}80%{translate:3px 0}}
.droptip{position:absolute;left:0;right:0;top:200px;text-align:center;font:600 italic 22px var(--disp);color:var(--accent);opacity:0;transition:opacity .2s;z-index:8;pointer-events:none}
.stagebox.hover .droptip{opacity:1}
.heartpop{position:absolute;bottom:170px;font-style:normal;font-size:22px;color:var(--cs);z-index:9;animation:hpop 1.6s ease-out both;pointer-events:none}
@keyframes hpop{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),-220px) scale(1.3);opacity:0}}
.cartlist{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.clhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink2)}
.clhead b{font:600 22px var(--disp);color:var(--ink);margin-right:4px}
.clmeter{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.clmeter i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--liq1),var(--liq2));transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.clmeter.over i{background:repeating-linear-gradient(45deg,var(--liq2) 0 8px,var(--cs) 8px 16px)}
.clitems{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.clrow{display:grid;grid-template-columns:44px minmax(0,1fr) 28px;gap:10px;align-items:center;padding:6px;border-radius:12px;transition:background .2s}
.clrow .th2{aspect-ratio:1}
.clrow.spill{background:color-mix(in srgb,var(--cs) 12%,transparent)}
.cln{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clp{font-size:12px;color:var(--ink3)}
.clrow.spill .clp{color:var(--cs);font-weight:600}
.clx{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);border:1px solid var(--line)}
.clx svg{width:12px;height:12px}
.clbtns{display:flex;flex-direction:column;gap:8px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.titem{position:relative;display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:grab;transition:transform .15s,border-color .15s}
.titem:hover{transform:translateY(-2px);border-color:var(--line2)}
.titem:active{cursor:grabbing}
.titem.in{border-color:var(--accent)}
.tin{font-size:11.5px;line-height:1.25;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tin b{display:block;color:var(--ink);font-size:11px}
.tip2{font:600 14px var(--disp)}
.tadd{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font:700 18px/1 var(--body);display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.4)}

/* gifts */
.gtl{position:relative;height:132px;margin:6px 4px 26px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.gtl::before{content:"";position:absolute;left:3%;right:3%;top:50%;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--line2))}
.gnow{position:absolute;left:3%;top:50%;transform:translate(-30%,-50%);padding:4px 9px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;z-index:2}
.gpin{position:absolute;top:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;white-space:nowrap}
.gpin i{width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.gpin b{margin-top:6px;color:var(--ink)}
.gpin.up{flex-direction:column-reverse;transform:translate(-50%,-100%)}
.gpin.up i{margin:0 0 -7px}
.gpin.up b{margin:0}
.gpin.up em{margin-bottom:6px}
.gpin em{font-style:normal;color:var(--ink3)}
.gpin.soon i{background:var(--accent);animation:pulse 1.6s ease-out infinite;box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}
@keyframes pulse{to{box-shadow:0 0 0 12px transparent}}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gcard.soon{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.gtop{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.gtop h3{font:500 italic 24px/1.1 var(--disp)}
.gtop p{font-size:13px;color:var(--ink2);margin:4px 0 8px}
.gring{width:96px;height:96px;border-radius:50%;display:grid;place-content:center;text-align:center;background:conic-gradient(var(--accent) calc(var(--p)*360deg),var(--line) 0);position:relative}
.gring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
.gring b,.gring span{position:relative}
.gring b{font:600 30px/1 var(--disp);color:var(--ink)}
.gring span{font-size:11px;color:var(--ink3);font-weight:600}
.gbud{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink3)}
.gbud input{width:84px;padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:600}
.gmeter{position:relative;height:26px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.gmeter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:13px;transition:width .5s}
.gmeter.over i{background:repeating-linear-gradient(45deg,var(--accent) 0 8px,#C2456C 8px 16px)}
.gmeter span{position:relative;display:block;text-align:center;font-size:12px;font-weight:700;line-height:24px;color:var(--ink)}
.glist{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:14px;transition:background .2s}
.grow .th2{aspect-ratio:1}
.grow.on{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.gname{display:block;text-align:left;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.gname:hover{color:var(--accent)}
.gp{font-size:12px;color:var(--ink2)}
.gp em{font-style:normal;font-weight:700;font-size:11px;padding:1px 6px;border-radius:999px;margin-left:4px}
.gsale{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.gfull{background:var(--bg2);color:var(--ink3)}
.gend{background:color-mix(in srgb,var(--hot) 14%,transparent);color:var(--hot)}
.gcheck{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.grow.on .gcheck{background:var(--accent);border-color:var(--accent);color:#fff}
.gadd{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--ink3)}
.gadd select{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:13px}

/* try on */
.trywrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,1fr);gap:20px;align-items:start}
.board{position:relative;aspect-ratio:4/5;max-height:80vh;width:100%;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,var(--card2),var(--bg2));border:1px solid var(--line);touch-action:none}

var SORTS={
  best:function(a,b){ return (live(b)-live(a)) || heroW(b)-heroW(a); },
  score:function(a,b){ return (live(b)-live(a)) || b.score-a.score; },
  pct:function(a,b){ return (b.pct||0)-(a.pct||0) || b.score-a.score; },
  saved:function(a,b){ return (b.saved$||0)-(a.saved$||0); },
  low:function(a,b){ return (a.price==null?1e9:a.price)-(b.price==null?1e9:b.price); },
  high:function(a,b){ return (b.price||0)-(a.price||0); },
  ends:function(a,b){ var x=a.ends?new Date(a.ends).getTime():9e15, y=b.ends?new Date(b.ends).getTime():9e15; return x-y || b.score-a.score; }

function applyF(list){
  var q=(F.q||'').toLowerCase().trim();

    if(F.who!=='all' && !(d.who===F.who || d.who==='both')) return false;
    if(F.cats.length && F.cats.indexOf(d.cat)<0) return false;
    if(F.stores.length && F.stores.indexOf(d.store)<0) return false;
    var p=d.price==null?0:d.price;
    if(p<F.pmin) return false;
    if(F.pmax<PMAX && p>F.pmax) return false;
    if((d.pct||0)<F.disc) return false;
    if(d.score<F.score) return false;
    if(F.hideEnded && !live(d)) return false;

}

        if(b.mode==='launch' && b.vy>0 && b.y>RIM-b.r && b.x<xL(RIM)-b.r*.4) b.mode='out';
        if(b.mode==='launch' && b.vy>0 && b.y>RIM && b.x>=xL(RIM) && b.x<=xR(RIM)){ b.vy=-13; b.vx=-(b.x-60)/48; }
        if(b.y>GROUND-b.r){ b.y=GROUND-b.r; if(b.vy>0) b.vy*=-.3; b.vx*=.8; }
        if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*.4; } if(b.x>CW-b.r){ b.x=CW-b.r; b.vx=-Math.abs(b.vx)*.4; }
      }
    }
  }
  for(i=0;i<cartBodies.length;i++){ b=cartBodies[i]; if(Math.abs(b.vx)+Math.abs(b.vy)>.12) moving++;
    b.el.style.transform='translate('+(b.x-b.r).toFixed(1)+'px,'+(b.y-b.r).toFixed(1)+'px) rotate('+b.a.toFixed(1)+'deg)';
    b.el.classList.toggle('out', b.mode!=='in'); }
  cartQuiet = moving? 0 : cartQuiet+1;
  if(cartQuiet<40) cartRaf=requestAnimationFrame(cartStep);
}
function fitStage(){
  var box=document.getElementById('stagebox'), st=document.getElementById('stage'); if(!box||!st) return;
  var k=Math.min(1.15, box.clientWidth/CW); st.style.transform='scale('+k.toFixed(3)+')'; box.style.height=(CH*k)+'px';
}
function initCart(w){
  cartWho=w; cartBodies=[]; fitStage(); renderTray(w); renderCartList(w);
  var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  syncBodies(w,true);
  if(reduce){ for(var n=0;n<400;n++){ cartStep(); if(cartRaf){ cancelAnimationFrame(cartRaf); cartRaf=null; } } }
  var stage=document.getElementById('stagebox');
  stage.addEventListener('dragover',function(e){ e.preventDefault(); stage.classList.add('hover'); });
  stage.addEventListener('dragleave',function(){ stage.classList.remove('hover'); });
  stage.addEventListener('drop',function(e){ e.preventDefault(); stage.classList.remove('hover'); var id=e.dataTransfer.getData('text/plain'); if(id) cartAdd(w,id,true); });
  stage.addEventListener('click',function(e){ var b=e.target.closest('.body'); if(b) openQV(b.getAttribute('data-bid')); });
}
function cartAdd(w,id,onlyAdd){
  var c=getCart(w), k=c.ids.indexOf(id);
  if(k>=0){ if(onlyAdd) return; c.ids.splice(k,1); } else c.ids.push(id);
  lsSet(cartKey(w),c); renderTray(w); renderCartList(w); syncBodies(w,false);
}
function cartCheckout(w){
  var c=getCart(w); if(!c.ids.length) return;
  var add=0; c.ids.forEach(function(id){ if(BY[id] && !isSaved(id)){ saved.push({id:id,'for':w,target:null,snap:snapOf(BY[id])}); add++; } });
  lsSet('dc4_saved',saved); c.ids.forEach(function(id){ syncSaved(id); });
  hearts(); toast(add?('Moved '+add+' to '+(w==='rachel'?'her gift box':'your watchlist')):'Everything here is already saved');
}
function hearts(){
  var s=document.getElementById('stage'); if(!s) return;
  for(var k=0;k<16;k++){ var h=document.createElement('i'); h.className='heartpop'; h.textContent='♥'; h.style.left=(30+Math.random()*50)+'%'; h.style.setProperty('--dx',((Math.random()-.5)*260).toFixed(0)+'px'); h.style.animationDelay=(Math.random()*.3).toFixed(2)+'s'; s.appendChild(h); (function(hh){ setTimeout(function(){ hh.remove(); },1800); })(h); }
}

/* ---------- gift countdown ---------- */
var gifts = lsGet('dc4_gifts', null) || {budgets:{}, done:{}, extra:{}};
function vGifts(){
  var occ=(RP.occasions||[]).map(function(o){ return {o:o,n:nextOcc(o)}; }).sort(function(a,b){ return a.n.days-b.n.days; });
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var h='<section class="caphead"><div><p class="eyebrow">Gift Countdown</p><h2>Her big days</h2><p>Every date has a budget and a short list. Prices update with each weekly search, so a drop shows up here.</p></div></section>';
  h+='<div class="gtl"><span class="gnow">Today</span>'+occ.map(function(x,k){ var p=Math.min(96,Math.max(7,4+x.n.days/365*92)); return '<span class="gpin'+(x.n.days<=21?' soon':'')+(k%2?' up':'')+'" style="left:'+p.toFixed(1)+'%"><i></i><b>'+esc(x.o.name)+'</b><em>'+mo[x.n.date.getMonth()]+' '+x.n.date.getDate()+' · '+x.n.days+' days</em></span>'; }).join('')+'</div>';
  h+='<div class="gcards">'+occ.map(function(x){
    var o=x.o, bud=gifts.budgets[o.id]||o.budget, ids=o.ids.concat(gifts.extra[o.id]||[]).filter(function(id,k,a){ return BY[id] && a.indexOf(id)===k; });
    var done=gifts.done[o.id]||[], spent=0; done.forEach(function(id){ if(BY[id]) spent+=BY[id].price||0; });
    var orderBy=new Date(x.n.date.getTime()-7*86400000), ring=Math.max(0,Math.min(1,1-x.n.days/120));
    var savedR=saved.filter(function(s){ return s.for==='rachel' && BY[s.id] && ids.indexOf(s.id)<0; });
    return '<article class="gcard'+(x.n.days<=21?' soon':'')+'"><div class="gtop"><div class="gring" style="--p:'+ring.toFixed(3)+'"><b>'+x.n.days+'</b><span>days</span></div><div><h3>'+esc(o.name)+'</h3><p>'+mo[x.n.date.getMonth()]+' '+x.n.date.getDate()+'. Order by '+mo[orderBy.getMonth()]+' '+orderBy.getDate()+' to be safe.</p>'+
      '<label class="gbud">Budget $<input type="number" min="0" step="10" value="'+bud+'" data-gbud="'+o.id+'" aria-label="Budget for '+esc(o.name)+'"/></label></div></div>'+
      '<div class="gmeter'+(spent>bud?' over':'')+'"><i style="width:'+Math.min(100,spent/bud*100).toFixed(1)+'%"></i><span>'+(spent?money(Math.round(spent)):'$0')+' picked of '+money(bud)+'</span></div>'+
      '<div class="glist">'+ids.map(function(id){ var d=BY[id], on=done.indexOf(id)>=0, ends=d.ends&&live(d)&&(new Date(d.ends)-Date.now()<36*3600000);
        return '<div class="grow'+(on?' on':'')+'">'+thumb(d)+'<div class="gi"><button class="gname" data-qv="'+id+'">'+esc(d.brand)+' '+esc(dname(d))+'</button><span class="gp">'+money(d.price)+(d.pct?' <em class="gsale">'+d.pct+'% off</em>':' <em class="gfull">Full price</em>')+(ends?' <em class="gend">Deal ends soon</em>':'')+'</span></div><button class="gcheck" data-gdone="'+o.id+'|'+id+'" aria-pressed="'+on+'" title="Mark as the gift">'+(on?'✓ Got it':'Pick')+'</button></div>'; }).join('')+'</div>'+
      (savedR.length?'<label class="gadd">Add from her gift box <select data-gadd="'+o.id+'"><option value="">Choose an item</option>'+savedR.map(function(s){ var d=BY[s.id]; return '<option value="'+s.id+'">'+esc(d.brand+' '+dname(d))+' · '+money(d.price)+'</option>'; }).join('')+'</select></label>':'')+
    '</article>'; }).join('')+'</div>';
  return h;
}

/* ---------- try on ---------- */
var tryon = lsGet('dc4_tryon', null) || {stickers:[]};
var tryPhoto = null; try{ tryPhoto=localStorage.getItem('dc4_tryon_photo'); }catch(e){}
var tryFilter='top';
function vTryOn(){
  return '<section class="caphead"><div><p class="eyebrow">Try On</p><h2>Style board</h2><p>Add a photo of her, then tap pieces to pin them on the board. Drag to move, use the corner to resize. Her photo stays on this computer only and is never uploaded.</p></div>'+
    '<div class="capbtns"><label class="btn sec">'+(tryPhoto?'Change photo':'Add her photo')+'<input type="file" accept="image/*" id="tryFile" hidden></label>'+(tryPhoto?'<button class="btn sec" data-tryrm="1">Remove photo</button>':'')+'<button class="btn sec" data-tryclear="1">Clear board</button></div></section>'+
    '<div class="trywrap"><div class="board" id="board"><div class="bphoto">'+(tryPhoto?'<img src="'+tryPhoto+'" alt="Her photo">':'<svg viewBox="0 0 200 420" class="silh" aria-hidden="true"><circle cx="100" cy="62" r="34"/><path d="M58 128c10-20 74-20 84 0l22 120c2 10-8 14-14 8l-14-60 6 230h-28l-14-150-14 150H58l6-230-14 60c-6 6-16 2-14-8z"/></svg><span class="bph">Add her photo to start</span>')+'</div><div class="stickers" id="stickers"></div></div>'+
    '<aside class="tryside"><div class="seg capseg" id="trySeg"></div><div class="trytiles" id="tryTiles"></div></aside></div>';
}
function renderTrySide(){
  var roles=[['top','Tops'],['bottom','Bottoms'],['dress','Dresses'],['outer','Coats'],['layer','Layers'],['bag','Bags'],['jewelry','Gold']];
  document.getElementById('trySeg').innerHTML=roles.map(function(r){ return '<button data-tryf="'+r[0]+'"'+(tryFilter===r[0]?' class="on"':'')+'>'+r[1]+'</button>'; }).join('');
  document.getElementById('tryTiles').innerHTML=rmain().filter(function(d){ return d.role===tryFilter; }).sort(function(a,b){ return b.score-a.score; }).map(function(d){ return '<button class="ttile" data-trypin="'+d.id+'">'+thumb(d)+'<span>'+esc(dname(d))+'</span></button>'; }).join('');
}
function renderStickers(){
  var el=document.getElementById('stickers'); if(!el) return;
  el.innerHTML=tryon.stickers.map(function(s,k){ var d=BY[s.id]; if(!d) return ''; return '<div class="stk'+photoCls(d)+'" data-stk="'+k+'" style="left:'+s.x+'%;top:'+s.y+'%;width:'+s.w+'%;z-index:'+(k+2)+'">'+imgTag(d)+'<button class="stx" data-stkx="'+k+'" aria-label="Remove">'+ICON.close+'</button><span class="stz" data-stkz="'+k+'" aria-hidden="true"></span></div>'; }).join('');
}
function initTryOn(){
  renderTrySide(); renderStickers();
  var board=document.getElementById('board'), drag=null;
  board.addEventListener('pointerdown',function(e){ var z=e.target.closest('[data-stkz]'), s=e.target.closest('[data-stk]'); if(e.target.closest('.stx')||!s) return; var k=+s.getAttribute('data-stk'), r=board.getBoundingClientRect(), st=tryon.stickers[k]; drag={k:k,mode:z?'size':'move',sx:e.clientX,sy:e.clientY,ox:st.x,oy:st.y,ow:st.w,W:r.width,H:r.height}; try{ board.setPointerCapture(e.pointerId); }catch(er){} e.preventDefault(); });
  board.addEventListener('pointermove',function(e){ if(!drag) return; var st=tryon.stickers[drag.k], dx=(e.clientX-drag.sx)/drag.W*100, dy=(e.clientY-drag.sy)/drag.H*100; if(drag.mode==='move'){ st.x=Math.max(-10,Math.min(95,drag.ox+dx)); st.y=Math.max(-10,Math.min(95,drag.oy+dy)); } else st.w=Math.max(10,Math.min(80,drag.ow+dx)); var el=board.querySelector('[data-stk="'+drag.k+'"]'); if(el){ el.style.left=st.x+'%'; el.style.top=st.y+'%'; el.style.width=st.w+'%'; } });
  board.addEventListener('pointerup',function(){ if(drag){ drag=null; lsSet('dc4_tryon',tryon); } });
}
function tryPin(id){ var n=tryon.stickers.length; tryon.stickers.push({id:id,x:52+(n%3)*12-12,y:8+(n%4)*20,w:24}); lsSet('dc4_tryon',tryon); renderStickers(); }
function tryLoad(file){
  if(!file) return; var fr=new FileReader();
  fr.onload=function(){ var im=new Image(); im.onload=function(){ var k=Math.min(1,1000/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); var url=c.toDataURL('image/jpeg',.82); try{ localStorage.setItem('dc4_tryon_photo',url); tryPhoto=url; }catch(e){ tryPhoto=url; toast('Photo added for this visit only. It was too big to keep.'); } render(); }; im.src=fr.result; };
  fr.readAsDataURL(file);
}

/* ---------- setup builder (Sam) ---------- */
var SLOTS=[['screen','Screen',['Screens & TV']],['laptop','Laptop',['Laptops & desk']],['audio','Audio',['Audio']],['play','Play',['Gaming']],['tech','Gear',['Phones & wearables','Smart home','PC build']],['build','Desk shelf',['LEGO','Reads','Home & cozy','Style','Adventure']]];
var setup = lsGet('dc4_setup', null) || {};
var setupTab='screen';
function vSetup(){
  return '<section class="caphead"><div><p class="eyebrow">Setup Builder</p><h2>Build the desk</h2><p>Pick one thing for each spot and see the whole setup, the total and what you save.</p></div><div class="capbtns"><button class="btn sec" data-setbest="1">Fill with top deals</button><button class="btn sec" data-setclear="1">Clear</button></div></section>'+
    '<div class="setwrap"><div class="desk" id="desk"></div><aside class="setside"><div class="seg capseg" id="setSeg"></div><div class="captiles" id="setTiles"></div></aside></div>';
}
function slotPool(s){ var sl=SLOTS.filter(function(x){ return x[0]===s; })[0]; return samList().filter(function(d){ return live(d) && d.price!=null && sl[2].indexOf(d.cat)>=0; }).sort(function(a,b){ return b.score-a.score; }); }
function renderSetup(){
  document.getElementById('setSeg').innerHTML=SLOTS.map(function(s){ return '<button data-settab="'+s[0]+'"'+(setupTab===s[0]?' class="on"':'')+'>'+s[1]+(setup[s[0]]?' <b>✓</b>':'')+'</button>'; }).join('');
  document.getElementById('setTiles').innerHTML=slotPool(setupTab).map(function(d){ var on=setup[setupTab]===d.id; return '<button class="ctile'+(on?' on':'')+'" data-setpick="'+d.id+'">'+thumb(d)+'<span class="ctn">'+esc(dname(d))+'</span><span class="ctp">'+money(d.price)+'</span><i class="ck" aria-hidden="true">✓</i></button>'; }).join('')||'<p class="muted">No live deals for this spot right now.</p>';
  var tot=0, sv=0, n=0; SLOTS.forEach(function(s){ var d=BY[setup[s[0]]]; if(d){ tot+=d.price||0; sv+=d.saved$||0; n++; } });
  var slot=function(k){ var d=BY[setup[k]], lab=SLOTS.filter(function(x){ return x[0]===k; })[0][1]; return '<button class="dslot s-'+k+(d?' full':'')+(setupTab===k?' sel':'')+'" data-settab="'+k+'">'+(d?'<span class="dimg'+photoCls(d)+'">'+imgTag(d)+'</span><span class="dlab">'+esc(dname(d))+'</span>':'<span class="dplus">+</span><span class="dlab">'+lab+'</span>')+'</button>'; };
  document.getElementById('desk').innerHTML='<div class="room"><div class="glowline"></div>'+slot('screen')+slot('build')+'<div class="desktop"></div>'+slot('laptop')+slot('audio')+slot('play')+slot('tech')+'<div class="legs"><i></i><i></i></div></div>'+
    '<div class="capstats"><div><b>'+n+'/6</b><span>spots filled</span></div><div><b>'+money(Math.round(tot))+'</b><span>total</span></div><div><b>'+money(Math.round(sv))+'</b><span>you save</span></div></div>'+
    (n?'<div class="capfoot"><button class="btn pri" data-setsave="1">'+ICON.heart.replace('<svg','<svg width="15" height="15"')+' Save setup to watchlist</button></div>':'');
}

renderEventBar(); renderFoot(); syncSaved(); buildFlora();
go((location.hash||'#today').replace('#','')||'today');
setInterval(function(){ tick(); if(Math.floor(Date.now()/1000)%30===0) renderEventBar(); },1000);
</script>
